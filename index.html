<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Space Shooter</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid lime;
    }
  </style>
</head>
<body>
  <canvas id="spiel" width="480" height="640"></canvas>

  <script>
    const canvas = document.getElementById("spiel");
    const ctx = canvas.getContext("2d");

    // Unser Raumschiff
    const schiff = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 60,
      breite: 40,
      hoehe: 30,
      tempo: 5
    };

    // NEU: Liste mit allen Laserschüssen
    let laser = [];
    // NEU: Wartezeit bis zum nächsten Schuss
    let nachladen = 0;

    // Welche Tasten sind gerade gedrückt?
    const tasten = {};
    document.addEventListener("keydown", (e) => {
      tasten[e.key] = true;
      // NEU: Leertaste soll die Seite nicht scrollen
      if (e.key === " ") e.preventDefault();
    });
    document.addEventListener("keyup", (e) => { tasten[e.key] = false; });

    function bewegen() {
      if (tasten["ArrowLeft"]) schiff.x -= schiff.tempo;
      if (tasten["ArrowRight"]) schiff.x += schiff.tempo;

      // Nicht aus dem Spielfeld fliegen
      if (schiff.x < 0) schiff.x = 0;
      if (schiff.x > canvas.width - schiff.breite) schiff.x = canvas.width - schiff.breite;

      // NEU: Schießen
      if (nachladen > 0) nachladen--;
      if (tasten[" "] && nachladen === 0) {
        laser.push({
          x: schiff.x + schiff.breite / 2 - 2,
          y: schiff.y,
          breite: 4,
          hoehe: 12,
          tempo: 8
        });
        nachladen = 15;
      }

      // NEU: Jeden Laser nach oben fliegen lassen
      for (const l of laser) {
        l.y -= l.tempo;
      }

      // NEU: Laser löschen, die oben aus dem Bild geflogen sind
      laser = laser.filter((l) => l.y + l.hoehe > 0);
    }

    function zeichnen() {
      // Alles schwarz übermalen
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Raumschiff als Dreieck
      ctx.fillStyle = "lime";
      ctx.beginPath();
      ctx.moveTo(schiff.x + schiff.breite / 2, schiff.y);
      ctx.lineTo(schiff.x, schiff.y + schiff.hoehe);
      ctx.lineTo(schiff.x + schiff.breite, schiff.y + schiff.hoehe);
      ctx.closePath();
      ctx.fill();

      // NEU: Alle Laser zeichnen
      ctx.fillStyle = "yellow";
      for (const l of laser) {
        ctx.fillRect(l.x, l.y, l.breite, l.hoehe);
      }
    }

    function spielSchleife() {
      bewegen();
      zeichnen();
      requestAnimationFrame(spielSchleife);
    }

    spielSchleife();
  </script>
</body>
</html>
