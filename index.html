<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Space Shooter</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid lime;
    }
  </style>
</head>
<body>
  <canvas id="spiel" width="480" height="640"></canvas>

  <script>
    const canvas = document.getElementById("spiel");
    const ctx = canvas.getContext("2d");

    // Unser Raumschiff
    const schiff = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 60,
      breite: 40,
      hoehe: 30,
      tempo: 5
    };

    // Liste mit allen Laserschüssen
    let laser = [];
    // Wartezeit bis zum nächsten Schuss
    let nachladen = 0;

    // NEU: Liste mit allen Gegnern
    let gegner = [];
    // NEU: Zeit bis zum nächsten Gegner
    let gegnerTimer = 0;

    // Welche Tasten sind gerade gedrückt?
    const tasten = {};
    document.addEventListener("keydown", (e) => {
      tasten[e.key] = true;
      // Leertaste soll die Seite nicht scrollen
      if (e.key === " ") e.preventDefault();
    });
    document.addEventListener("keyup", (e) => { tasten[e.key] = false; });

    function bewegen() {
      if (tasten["ArrowLeft"]) schiff.x -= schiff.tempo;
      if (tasten["ArrowRight"]) schiff.x += schiff.tempo;

      // Nicht aus dem Spielfeld fliegen
      if (schiff.x < 0) schiff.x = 0;
      if (schiff.x > canvas.width - schiff.breite) schiff.x = canvas.width - schiff.breite;

      // Schießen
      if (nachladen > 0) nachladen--;
      if (tasten[" "] && nachladen === 0) {
        laser.push({
          x: schiff.x + schiff.breite / 2 - 2,
          y: schiff.y,
          breite: 4,
          hoehe: 12,
          tempo: 8
        });
        nachladen = 15;
      }

      // Jeden Laser nach oben fliegen lassen
      for (const l of laser) {
        l.y -= l.tempo;
      }

      // Laser löschen, die oben aus dem Bild geflogen sind
      laser = laser.filter((l) => l.y + l.hoehe > 0);

      // NEU: Neue Gegner erscheinen lassen
      gegnerTimer--;
      if (gegnerTimer <= 0) {
        gegner.push({
          x: 6 + Math.random() * (canvas.width - 48),
          y: -30,
          breite: 36,
          hoehe: 26,
          tempo: 1 + Math.random() * 2
        });
        gegnerTimer = 60;
      }

      // NEU: Jeden Gegner nach unten fliegen lassen
      for (const g of gegner) {
        g.y += g.tempo;
      }

      // NEU: Gegner löschen, die unten aus dem Bild geflogen sind
      gegner = gegner.filter((g) => g.y < canvas.height);
    }

    // NEU: Ein Alien zeichnen
    function zeichneAlien(g) {
      ctx.fillStyle = "magenta";
      ctx.fillRect(g.x, g.y, g.breite, g.hoehe);          // Körper
      ctx.fillRect(g.x - 6, g.y + 8, 6, 12);             // linker Arm
      ctx.fillRect(g.x + g.breite, g.y + 8, 6, 12);      // rechter Arm
      ctx.fillStyle = "black";
      ctx.fillRect(g.x + 8, g.y + 8, 6, 6);              // linkes Auge
      ctx.fillRect(g.x + g.breite - 14, g.y + 8, 6, 6);  // rechtes Auge
    }

    function zeichnen() {
      // Alles schwarz übermalen
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Raumschiff als Dreieck
      ctx.fillStyle = "lime";
      ctx.beginPath();
      ctx.moveTo(schiff.x + schiff.breite / 2, schiff.y);
      ctx.lineTo(schiff.x, schiff.y + schiff.hoehe);
      ctx.lineTo(schiff.x + schiff.breite, schiff.y + schiff.hoehe);
      ctx.closePath();
      ctx.fill();

      // Alle Laser zeichnen
      ctx.fillStyle = "yellow";
      for (const l of laser) {
        ctx.fillRect(l.x, l.y, l.breite, l.hoehe);
      }

      // NEU: Alle Gegner zeichnen
      for (const g of gegner) {
        zeichneAlien(g);
      }
    }

    function spielSchleife() {
      bewegen();
      zeichnen();
      requestAnimationFrame(spielSchleife);
    }

    spielSchleife();
  </script>
</body>
</html>
