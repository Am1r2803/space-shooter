<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Space Shooter</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid lime;
    }
  </style>
</head>
<body>
  <canvas id="spiel" width="480" height="640"></canvas>

  <script>
    const canvas = document.getElementById("spiel");
    const ctx = canvas.getContext("2d");

    // Unser Raumschiff
    const schiff = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 60,
      breite: 40,
      hoehe: 30,
      tempo: 5
    };

    // Liste mit allen Laserschüssen
    let laser = [];
    // Wartezeit bis zum nächsten Schuss
    let nachladen = 0;

    // Liste mit allen Gegnern
    let gegner = [];
    // Zeit bis zum nächsten Gegner
    let gegnerTimer = 0;

    // NEU: Punktestand und ob das Spiel vorbei ist
    let punkte = 0;
    let spielVorbei = false;

    // NEU: Prüft, ob sich zwei Rechtecke überlappen
    function beruehren(a, b) {
      return a.x < b.x + b.breite &&
             a.x + a.breite > b.x &&
             a.y < b.y + b.hoehe &&
             a.y + a.hoehe > b.y;
    }

    // NEU: Alles auf Anfang zurücksetzen
    function neustart() {
      schiff.x = canvas.width / 2 - 20;
      laser = [];
      gegner = [];
      nachladen = 0;
      gegnerTimer = 0;
      punkte = 0;
      spielVorbei = false;
    }

    // Welche Tasten sind gerade gedrückt?
    const tasten = {};
    document.addEventListener("keydown", (e) => {
      tasten[e.key] = true;
      // Leertaste soll die Seite nicht scrollen
      if (e.key === " ") e.preventDefault();
    });
    document.addEventListener("keyup", (e) => { tasten[e.key] = false; });

    function bewegen() {
      // NEU: Bei Game Over nur noch auf Enter warten
      if (spielVorbei) {
        if (tasten["Enter"]) neustart();
        return;
      }

      if (tasten["ArrowLeft"]) schiff.x -= schiff.tempo;
      if (tasten["ArrowRight"]) schiff.x += schiff.tempo;

      // Nicht aus dem Spielfeld fliegen
      if (schiff.x < 0) schiff.x = 0;
      if (schiff.x > canvas.width - schiff.breite) schiff.x = canvas.width - schiff.breite;

      // Schießen
      if (nachladen > 0) nachladen--;
      if (tasten[" "] && nachladen === 0) {
        laser.push({
          x: schiff.x + schiff.breite / 2 - 2,
          y: schiff.y,
          breite: 4,
          hoehe: 12,
          tempo: 8
        });
        nachladen = 15;
      }

      // Jeden Laser nach oben fliegen lassen
      for (const l of laser) {
        l.y -= l.tempo;
      }

      // Laser löschen, die oben aus dem Bild geflogen sind
      laser = laser.filter((l) => l.y + l.hoehe > 0);

      // Neue Gegner erscheinen lassen
      gegnerTimer--;
      if (gegnerTimer <= 0) {
        gegner.push({
          x: 6 + Math.random() * (canvas.width - 48),
          y: -30,
          breite: 36,
          hoehe: 26,
          tempo: 1 + Math.random() * 2
        });
        gegnerTimer = 60;
      }

      // Jeden Gegner nach unten fliegen lassen
      for (const g of gegner) {
        g.y += g.tempo;
      }

      // Gegner löschen, die unten aus dem Bild geflogen sind
      gegner = gegner.filter((g) => g.y < canvas.height);

      // NEU: Hat ein Laser ein Alien getroffen?
      for (const l of laser) {
        for (const g of gegner) {
          if (!l.getroffen && !g.getroffen && beruehren(l, g)) {
            l.getroffen = true;
            g.getroffen = true;
            punkte += 10;
          }
        }
      }
      laser = laser.filter((l) => !l.getroffen);
      gegner = gegner.filter((g) => !g.getroffen);

      // NEU: Hat ein Alien dein Schiff erwischt?
      for (const g of gegner) {
        if (beruehren(schiff, g)) {
          spielVorbei = true;
        }
      }
    }

    // Ein Alien zeichnen
    function zeichneAlien(g) {
      ctx.fillStyle = "magenta";
      ctx.fillRect(g.x, g.y, g.breite, g.hoehe);          // Körper
      ctx.fillRect(g.x - 6, g.y + 8, 6, 12);             // linker Arm
      ctx.fillRect(g.x + g.breite, g.y + 8, 6, 12);      // rechter Arm
      ctx.fillStyle = "black";
      ctx.fillRect(g.x + 8, g.y + 8, 6, 6);              // linkes Auge
      ctx.fillRect(g.x + g.breite - 14, g.y + 8, 6, 6);  // rechtes Auge
    }

    function zeichnen() {
      // Alles schwarz übermalen
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Raumschiff als Dreieck
      ctx.fillStyle = "lime";
      ctx.beginPath();
      ctx.moveTo(schiff.x + schiff.breite / 2, schiff.y);
      ctx.lineTo(schiff.x, schiff.y + schiff.hoehe);
      ctx.lineTo(schiff.x + schiff.breite, schiff.y + schiff.hoehe);
      ctx.closePath();
      ctx.fill();

      // Alle Laser zeichnen
      ctx.fillStyle = "yellow";
      for (const l of laser) {
        ctx.fillRect(l.x, l.y, l.breite, l.hoehe);
      }

      // Alle Gegner zeichnen
      for (const g of gegner) {
        zeichneAlien(g);
      }

      // NEU: Punktestand oben links
      ctx.fillStyle = "white";
      ctx.font = "20px monospace";
      ctx.textAlign = "left";
      ctx.fillText("PUNKTE: " + punkte, 10, 30);

      // NEU: Game-Over-Bildschirm
      if (spielVorbei) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "red";
        ctx.font = "48px monospace";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = "white";
        ctx.font = "20px monospace";
        ctx.fillText("Punkte: " + punkte, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText("Enter = Neustart", canvas.width / 2, canvas.height / 2 + 55);
      }
    }

    function spielSchleife() {
      bewegen();
      zeichnen();
      requestAnimationFrame(spielSchleife);
    }

    spielSchleife();
  </script>
</body>
</html>
